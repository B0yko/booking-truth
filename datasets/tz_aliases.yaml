# Curated time zone abbreviations and names for the tz_resolver guard.
#
# Each entry is either "resolved" (one dominant IANA zone: the reading almost everyone means) or
# "ambiguous" (two or more IANA zones a reasonable person could mean, listed as candidates). The
# resolver matches whole words or phrases, case-insensitively for a name written with any lower-case
# letter ("Eastern time", "India Standard Time") and case-sensitively for a name written in all
# capitals ("IST", "CST"), so a casual lower-case word ("ist", the German "is") never matches an
# abbreviation. The longest match wins when more than one entry's text appears. Every zone below is
# checked against the installed IANA tz database by tests/guards/tz/test_data.py.
#
# Sources: design-agent.md SS4/SSD (ambiguous set) and the IANA tz database's own abbreviation
# tables (dominant US, EU and other regional readings).

# Ambiguous: abbreviations and names used for two or more non-equivalent regions -------------------

- text: IST
  status: ambiguous
  candidates: [Asia/Kolkata, Asia/Jerusalem, Europe/Dublin]
- text: CST
  status: ambiguous
  candidates: [America/Chicago, Asia/Shanghai]
- text: BST
  status: ambiguous
  candidates: [Europe/London, Asia/Dhaka]
- text: AST
  status: ambiguous
  candidates: [America/Halifax, America/Puerto_Rico, Asia/Riyadh]
- text: Atlantic time
  status: ambiguous
  candidates: [America/Halifax, America/Puerto_Rico]
- text: PST
  status: ambiguous
  candidates: [America/Los_Angeles, Asia/Manila]
- text: Mountain time
  status: ambiguous
  candidates: [America/Denver, America/Phoenix]
- text: Australian Eastern Time
  status: ambiguous
  candidates: [Australia/Sydney, Australia/Brisbane]
- text: Australian Central Time
  status: ambiguous
  candidates: [Australia/Adelaide, Australia/Darwin]

