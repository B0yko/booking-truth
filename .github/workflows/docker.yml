name: docker

# Builds the image for linux/amd64 and linux/arm64. Pushes to ghcr.io/b0yko/booking-truth on main (tag "edge")
# and on version tags (v0.1.0 -> 0.1.0, 0.1 and latest). Pull requests build without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the compose files
        env:
          BT_LEDGER_DIR: ${{ runner.temp }}/ledger
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.bench.yml config --quiet

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the runner platform (loaded for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: booking-truth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the CLI and the sandbox entrypoint
        run: |
          docker run --rm booking-truth:ci --version
          docker run -d --name sandbox -p 127.0.0.1:8100:8100 booking-truth:ci sandbox serve --host 0.0.0.0
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8100/_ui && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8100/_ui
          docker rm -f sandbox

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/b0yko/booking-truth
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=ref,event=pr

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

