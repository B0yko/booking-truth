name: Feature request
description: Suggest a scenario, an adapter or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? For a new scenario, describe the prospect, the fault and the expected end state.
    validations:
      required: true
