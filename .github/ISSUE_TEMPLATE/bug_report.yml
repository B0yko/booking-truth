name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, configuration (remove secrets) and, for a harness issue, the scenario id and trace id.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `booking-truth --version`, or the image tag.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Harness (test, report, compare)
        - Sandbox
        - Reference agent
        - Widget
        - Docker / deployment
        - Documentation
    validations:
      required: true
