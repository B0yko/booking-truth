[project]
name = "booking-truth"
version = "0.1.0"
description = "Tests AI appointment-setting agents on the calendar's end state, and ships a guarded booking agent."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrii Boiko" }]
requires-python = ">=3.12"
keywords = ["ai-agents", "agent-evaluation", "appointment-scheduling", "calcom", "google-calendar", "hubspot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
booking-truth = "booking_truth.cli:main"

[project.urls]
Homepage = "https://github.com/B0yko/booking-truth"
Issues = "https://github.com/B0yko/booking-truth/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_truth"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "booking_truth/_data/scenarios"
"datasets" = "booking_truth/_data/datasets"
"schemas" = "booking_truth/_data/schemas"
"pricing.yaml" = "booking_truth/_data/pricing.yaml"
"widget/widget.js" = "booking_truth/_data/widget/widget.js"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "DTZ"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "DTZ001", "DTZ005"]
"scripts/**" = ["S603", "S607", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not live and not e2e'"
markers = [
    "live: talks to a real paid or third-party service; skipped without credentials",
    "e2e: browser end-to-end tests (Playwright)",
    "slow: long-running offline suite",
]
