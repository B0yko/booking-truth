# Booking create commits on the calendar and then hangs past the client's timeout, the way a real network
# stall can leave a write's outcome unknown after it actually landed. With the guard the agent looks for the
# booking it already made instead of blindly retrying, adopts it and confirms normally. Without it the
# write is reported as failed even though the calendar holds it, so the prospect is told nothing is booked.
guard: idempotency
title: A create that commits and then times out is adopted, not repeated or lost
scenario:
  id: idempotency-commit-then-timeout
  title: Book when booking create commits and then times out
  tags: [fault]
  # On Google, a service account is refused the moment it sends an attendee unless the calendar allows it;
  # without this, the very first insert of a trial (which still tries the lead as an attendee) would be
  # rejected before it ever reaches the fault, so "commit" would not actually commit anything and this
  # fixture would end up testing the unrelated attendee retry instead of idempotency.
  seed: {google_sa_can_invite: true}
  faults:
    - {group: bookings.create, mode: commit_then_timeout, times: 1}
  persona:
    given_name: Priya
    initial: K
    style: brief
    goal: book
    true_zone: America/New_York
    timezone_statement: "I'm in New York."
    clarification: "Eastern time, New York."
    window:
      dates: {rule: next_business_days, count: 5}
      start: "13:00"
      end: "17:00"
    correction: "Could we do an afternoon {{window.dates_text}}, between 1 and 5 pm New York time?"
    script:
      - say: "Hi, I'd like to book an intro call in the next few days, afternoons if possible. I'm in New York."
      - say: "Eastern time, New York."
        when: agent_asks_timezone
      - pick: in_window
      - say: "Yes, please book it."
        when: agent_asks_confirmation
      - say: "Thanks."
        end: true
  expect:
    bookings: 1
    status: booked
    in_window: true
expect_on:
  outcome: pass
  assert:
    - guard_event: {guard: idempotency, event: adopted}
    - active_bookings: {eq: 1}
    - reply_matches: "Booked:"
  assert_not:
    - reply_matches: "didn't accept that"
    - guard_event: {guard: claim_ledger, event: unverified}
expect_off:
  # The naive retry resends the exact same request with no id or key. Cal.com itself rejects a create for
  # an already-booked time, so the resend is refused and the prospect is told nothing is booked
  # (unclaimed_booking, one active booking: the original commit). Google's insert does no conflict check
  # at all, so the resend lands as a second event the agent's own claim ledger verifies normally
  # (double_booking, two active bookings) — the design notes this split explicitly. Either reading is the
  # same real integrity violation: a write whose outcome was unknown after a timeout was repeated instead
  # of adopted.
  outcome_in: [unclaimed_booking, double_booking]
  assert:
    - active_bookings: {gte: 1}
  assert_not:
    - guard_event: {guard: idempotency, event: adopted}
