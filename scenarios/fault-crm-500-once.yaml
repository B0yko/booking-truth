id: fault-crm-500-once
title: Book while the CRM returns 500 once
tags: [fault, crm]
faults:
  - {group: crm.*, mode: error_500, times: 1}
persona:
  given_name: Sam
  initial: O
  style: brief
  goal: book
  true_zone: America/New_York
  timezone_statement: "I'm in New York."
  timezone_hint: null
  clarification: "Eastern time, New York."
  window:
    dates: {rule: next_business_days, count: 5}
    start: "10:00"
    end: "16:00"
  correction: "Could we do {{window.dates_text}}, between 10 am and 4 pm New York time?"
  script:
    - say: "Hi, I'd like to book an intro call in the next few days. I'm in New York."
    - say: "Eastern time, New York."
      when: agent_asks_timezone
    - pick: in_window
    - say: "Yes, please book it."
      when: agent_asks_confirmation
    - say: "Thanks."
      end: true
expect:
  bookings: 1
  status: booked
  in_window: true
