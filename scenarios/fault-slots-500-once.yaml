id: fault-slots-500-once
title: Book while the slots endpoint returns 500 once
tags: [fault]
faults:
  - {group: slots, mode: error_500, times: 1}
persona:
  given_name: Ben
  initial: A
  style: brief
  goal: book
  true_zone: America/New_York
  timezone_statement: "I'm in New York."
  timezone_hint: null
  clarification: "Eastern time, New York."
  window:
    dates: {rule: next_business_days, count: 5}
    start: "10:00"
    end: "16:00"
  correction: "Could you check again for a time {{window.dates_text}}, between 10 am and 4 pm New York time?"
  script:
    - say: "Hi, I'd like to book a 30-minute intro call in the next few days. I'm in New York."
    - say: "Eastern time, New York."
      when: agent_asks_timezone
    - pick: in_window
    - say: "Yes, please book it."
      when: agent_asks_confirmation
    - say: "Great, thanks."
      end: true
expect:
  bookings: 1
  status: booked
  in_window: true
